map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream endstep_backend {
    server endstep-backend:8080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # backend: REST, WebSocket STOMP, OAuth, uploads locais, health
    location /api/      { proxy_pass http://endstep_backend; include /etc/nginx/proxy_common.conf; }
    location /oauth2/   { proxy_pass http://endstep_backend; include /etc/nginx/proxy_common.conf; }
    location /login/    { proxy_pass http://endstep_backend; include /etc/nginx/proxy_common.conf; }
    location /uploads/  { proxy_pass http://endstep_backend; include /etc/nginx/proxy_common.conf; }
    location /actuator/ { proxy_pass http://endstep_backend; include /etc/nginx/proxy_common.conf; }

    location /ws {
        proxy_pass http://endstep_backend;
        include /etc/nginx/proxy_common.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # front estático (SPA)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri /index.html;
    }
}
