<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#111;margin:0;padding:40px}</style>
</head>
<body>
<div class="fixed inset-0 z-40 flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm">
  <div class="flex max-h-[85vh] w-full max-w-2xl flex-col overflow-hidden p-5 bg-[#232343] rounded-xl">
    <div class="flex shrink-0 items-center justify-between text-white">
      <h2 class="text-base font-semibold">Arte de Sol Ring</h2>
      <button class="text-sm">+ Criar arte</button>
    </div>
    <div class="mt-4 grid min-h-0 flex-1 grid-cols-3 gap-3 overflow-y-auto pr-1 sm:grid-cols-4" id="grid">
    </div>
  </div>
</div>
<script>
const grid = document.getElementById('grid');
for (let i = 0; i < 40; i++) {
  const btn = document.createElement('button');
  btn.className = "relative aspect-[488/680] w-full overflow-hidden rounded-lg border border-gray-600 bg-gray-700 text-left";
  btn.innerHTML = `
    <div style="width:100%;height:100%;background:hsl(${i*20},70%,40%)"></div>
    <span class="absolute inset-x-0 bottom-0 truncate bg-black/70 px-1.5 py-1 text-[10px] text-gray-300">Printing ${i}</span>
  `;
  grid.appendChild(btn);
}
</script>
</body>
</html>
